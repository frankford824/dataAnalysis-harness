[package]
name = "ledger-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arrow-array = "59.2"
arrow-schema = "59.2"
axum = "0.8"
calamine = "0.36.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
hex = "0.4"
notify = "8.2"
parquet = { version = "59.2", features = ["arrow"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tantivy = "0.26.1"
tokio = { version = "1.49", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
