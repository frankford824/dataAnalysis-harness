# 平台清单。
#
# 这个文件存在的理由：平台不能是代码里的常量。它出现在店铺的 platform、
# 指标的 by_platform、科目字典的 platform 列上——写死在代码里，就等于「支持哪些
# 平台」被焊进了版本号，接快手要发一次版。放在这里，接一个平台就是加一条。
#
# hints 只用来在登记新店时猜平台，猜错没关系，反正要人确认。它绝不参与计算：
# 猜出来的东西不能进账。
#
# 顺带管错字：店铺的 platform 拼成 "taobao " 带个空格，这家店的平台专属规则
# 一条都不生效，账少算而界面全绿。有了这份清单，加载时就会拦下来。

- id: taobao
  name: 淘宝天猫
  hints: [淘宝, 天猫, tmall, TB]

- id: alibaba1688
  name: 阿里巴巴 1688
  # "1688" 必须加引号，否则 YAML 读成整数，加载时报 hints.0 不是字符串。
  hints: ["1688", 阿里巴巴, 阿里]

- id: douyin
  name: 抖音
  hints: [抖音, 抖店]

- id: pdd
  name: 拼多多
  hints: [拼多多, PDD, pdd]
  # 科目字典已按这个平台导入 27 条。
  note: 2026-08 已有在营店铺（原注「暂无在营店铺」已过期）。

- id: jd
  name: 京东
  hints: [京东, JD, jd]
  note: 2026-08 已有在营店铺（原注「暂无在营店铺」已过期）。

# 下面四个是 2026-08-26 按 ERP 订单库的实际在营平台补齐的。
# 补之前台账只认五个平台，而 ERP 那边这四个平台上一共 31 家店在出单——
# 其中「其它平台」的永箔 452 万、「线下店铺」的孙俪 282 万，是金额排前三的店。
# 平台没登记，这些店就一家都登记不进来：_integrity 会拦下 platform 不在清单里的店铺。
#
# 后两个（offline、other）不是真实销售渠道，是聚水潭的兜底分类。2026-08-26 明确
# 决定：**照聚水潭返回的原样保留，先不拆**。理由是订单系统和台账两边的平台口径
# 必须对得上——聚水潭那边一家店挂在「其它平台」，台账这边就得也是「其它平台」，
# 否则按平台对总额时两边差出来的数没人解释得清，而这种对不上是静默的。
# 拆分带来的分类精度，眼下抵不上两套口径并存的代价。这是有意为之，不是没人管的遗留。
#
# 将来真要拆，做法是：先在这个文件里加一条新平台，再改那几家店的 platform 字段
# （platform 在 config.EDITABLE 里，是可改的）。id 和 name 一个都不要动——
# 认文件靠 name、关联靠 id，动了历史账就对不上。只改 platform 不影响任何历史归属，
# 影响的只是平台专属的指标规则和科目字典按哪个平台查。拆之前记得先把新平台的
# 字典条目和费项规则备齐，否则那几家店会突然一条平台规则都命中不了。

- id: kuaishou
  name: 快手
  hints: [快手, 快手电商, KS]
  note: ERP 侧写「快手电商」。目前一家店，46 单。

- id: xiaohongshu
  name: 小红书
  hints: [小红书, XHS, xhs]
  # 别和拼多多那家「宋永康-PDD小红薯气球派对」搞混，那是店名里带「小红薯」，不是这个平台。
  note: 目前一家店，25 单。

- id: offline
  name: 线下店铺
  hints: [线下, 线下店铺, 门店]
  note: >-
    聚水潭的分类，照原样保留，有意不拆。三家店：孙俪 282 万、王红 19 万、
    亚马逊-王红 160 元。最后那家叫「亚马逊」却挂在「线下店铺」下，明摆着不是线下，
    是聚水潭那边归类将就的结果——但台账这边跟着将就，是为了和订单系统的口径一致：
    按平台对总额时两边能对上，比这个平台名字准确更要紧。要拆的话见文件上方那段。

- id: other
  name: 其它平台
  hints: [其它, 其他, 国际站]
  note: >-
    聚水潭的兜底分类，照原样保留，有意不拆。两家店：永箔 452 万、国际站——王红 52 元。
    永箔是全公司金额最大的一家店，却落在一个叫「其它」的兜底分类里——看着不合理，
    但它在聚水潭那边就是这么挂的，台账擅自挪走就会和订单系统对不上账。
    「兜底分类」和「金额第一」同时成立这件事本身值得记一笔：将来谁要拆，
    先从永箔查起，确认它实际走的是哪个渠道。要拆的话见文件上方那段。
