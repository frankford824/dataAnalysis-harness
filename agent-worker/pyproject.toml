[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ledger-autonomous-worker"
version = "0.1.0"
description = "AgentScope runtime with evidence-bound ledger tools and durable host-agent protocol"
requires-python = ">=3.12"
dependencies = ["agentscope==2.0.11", "httpx==0.28.1"]

[project.scripts]
ledger-agent = "ledger_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ledger_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
